<h1 class="title" id="conditionally-accepted-returns"><div style="display: inline;">Conditionally accepted returns</div></h1>
<div class="shortdesc"><div style="display: inline;">A conditionally accepted status means the state requires additional information from you or needs more time to process your return.</div></div>
<div style="display: inline;"><div class="note important" data-label="IMPORTANT"><span class="headerTitle" style="text-transform: capitalize;">important</span><div style="display: inline;">Don’t resubmit the return.</div></div><div class="p"><div style="display: inline;">Check the <b class="ph uicontrol"><div style="display: inline;">E-file Status Report</div></b> for details about the state's request or processing requirements.</div></div></div>
</div>
