<h1 class="title" id="no-longer-accepting-yyyy-returns"><div style="display: inline;">No longer accepting YYYY returns</div></h1>
<div style="display: inline;">
<pre class="pre msgblock"><div style="display: inline;">The State of Rhode Island is no longer accepting YYYY returns through the electronic filing system.</div></pre>
</div>
<div style="display: inline;"><section class="section"><div style="display: inline;"><h2 class="title" id="solution"><div style="display: inline;">Solution</div></h2>
<div class="p"><div style="display: inline;">Rhode Island only supports e-filing of the current tax year. There's not a way to clear this diagnostic. This return needs to be paper filed.</div></div></div></section></div>
</div>
