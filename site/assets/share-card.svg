<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">GS E-file Resolver — from rejection to resolution</title>
  <!-- Open Graph / Twitter card, 1200x630. Rasterized to share-card.png by
       builder/make_icons.py.

       Flat fills, one accent, no gradients — the same rules as the interface.
       Type is a system sans stack rather than Public Sans: this file is rasterized
       locally by `sips`, which can only use fonts installed on the machine, so
       naming a webfont here would silently fall back to something arbitrary.
       Plain "Helvetica" is named on purpose: asking for "Helvetica Neue" let the
       rasterizer resolve the bold weight to a condensed black variant, which set
       the headline far tighter than intended. -->
  <rect width="1200" height="630" fill="#f6f7f9"/>
  <rect width="1200" height="8" fill="#1a4bc4"/>

  <!-- Quiet structural motif: the code column of a diagnostic list. Low contrast
       on purpose so it never competes with the headline. -->
  <g fill="#dde3ec">
    <rect x="762" y="212" width="150" height="12" rx="3"/>
    <rect x="762" y="254" width="212" height="12" rx="3"/>
    <rect x="762" y="296" width="178" height="12" rx="3"/>
    <rect x="762" y="338" width="240" height="12" rx="3"/>
    <rect x="762" y="380" width="132" height="12" rx="3"/>
  </g>
  <g fill="#c3d0e6">
    <rect x="678" y="212" width="66" height="12" rx="3"/>
    <rect x="678" y="254" width="66" height="12" rx="3"/>
    <rect x="678" y="296" width="66" height="12" rx="3"/>
    <rect x="678" y="338" width="66" height="12" rx="3"/>
    <rect x="678" y="380" width="66" height="12" rx="3"/>
  </g>

  <!-- The mark, at 1.5x its 64-unit artboard -->
  <g transform="translate(84 70) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#1a4bc4"/>
    <path d="M18 13h19l9 9v26a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3Z" fill="#ffffff"/>
    <path d="M37 13v9h9Z" fill="#b9cbf5"/>
    <path d="M23 33l6 6 11-14" fill="none" stroke="#0f6b46" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="196" y="108" fill="#566171" font-size="22" font-weight="700" letter-spacing="4.5">GS E-FILE RESOLVER</text>
    <text x="196" y="148" fill="#101519" font-size="26" font-weight="500">GoSystem Tax RS knowledge desk</text>

    <text x="84" y="300" fill="#101519" font-size="78" font-weight="700" letter-spacing="-0.5">From rejection</text>
    <text x="84" y="388" fill="#123a9e" font-size="78" font-weight="700" letter-spacing="-0.5">to resolution.</text>

    <text x="84" y="450" fill="#39424e" font-size="26">Paste the diagnostic, or browse every indexed error by jurisdiction.</text>

    <text x="84" y="566" fill="#101519" font-size="30" font-weight="700">1,288</text>
    <text x="84" y="592" fill="#566171" font-size="17" letter-spacing="1.2">ARTICLES</text>
    <text x="290" y="566" fill="#101519" font-size="30" font-weight="700">508</text>
    <text x="290" y="592" fill="#566171" font-size="17" letter-spacing="1.2">REJECT CODES</text>
    <text x="540" y="566" fill="#101519" font-size="30" font-weight="700">51</text>
    <text x="540" y="592" fill="#566171" font-size="17" letter-spacing="1.2">JURISDICTIONS</text>
    <text x="1116" y="592" fill="#566171" font-size="17" letter-spacing="1.2" text-anchor="end">FEDERAL + 50 STATES + D.C.</text>
  </g>

  <rect x="84" y="512" width="1032" height="1" fill="#d8dde5"/>
</svg>
