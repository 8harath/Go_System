<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GS E-file Resolver</title>
  <desc id="desc">A help document marked resolved</desc>
  <!-- Maskable source for the installed-app icons (app-icon-180/512.png).

       Two differences from logo-mark.svg, both required by the maskable contract:
       the background is FULL BLEED with no rounded corners, because the platform
       applies its own mask (a circle on Android, a squircle on iOS) and any
       rounding baked in here would show as a double corner; and the glyph fits
       inside the maskable safe zone — the centre circle of radius 40% (25.6 units
       here). The sheet is 28x38, so its half-diagonal is 23.6 < 25.6, meaning no
       platform mask can clip it.

       The old manifest declared logo-mark.svg itself as "any maskable", which was
       wrong: its rx=14 corners would have been cropped by the mask. -->
  <rect width="64" height="64" fill="#1a4bc4"/>
  <path d="M18 13h19l9 9v26a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3Z" fill="#ffffff"/>
  <path d="M37 13v9h9Z" fill="#b9cbf5"/>
  <path d="M23 33l6 6 11-14" fill="none" stroke="#0f6b46" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
