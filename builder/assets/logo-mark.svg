<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GS E-file Resolver</title>
  <desc id="desc">A help document marked resolved</desc>
  <!-- Flat fills only: no gradient, no drop shadow. The mark has to stay legible
       at 16px in a browser tab, and it has to obey the same design rules as the
       interface it belongs to (see builder/assets/styles.css).

       Colours are the theme's own tokens: the brand indigo for the field, the
       resolved green for the check. Green here means exactly what it means
       everywhere else in the product (resolved) and nothing in the mark competes
       with it. The old gold accent is gone: amber now means "attention", which is
       the wrong thing for a logo to say.

       Rounded square: this is the favicon and the in-app brand mark. The
       full-bleed maskable variant is app-icon.svg. -->
  <rect width="64" height="64" rx="14" fill="#1a4bc4"/>
  <path d="M18 13h19l9 9v26a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3Z" fill="#ffffff"/>
  <path d="M37 13v9h9Z" fill="#b9cbf5"/>
  <path d="M23 33l6 6 11-14" fill="none" stroke="#0f6b46" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
